name: Tokens check

# Fails a push or PR if tokens/tokens.json was edited
# without regenerating assets/css/tokens.css.

on:
  push:
    paths: ['tokens/**', 'assets/css/tokens.css', 'scripts/build-tokens.mjs']
  pull_request:
    paths: ['tokens/**', 'assets/css/tokens.css', 'scripts/build-tokens.mjs']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-tokens.mjs --check
